[package]
name = "nom"
version = "0.2.1"
edition = "2024"

[lib]
# Differs from the bin name, so their .pdb files don't collide on Windows
name = "nom_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.41", optional = true, features = ["bundled"] }
# multipart: photo uploads
leptos = { version = "0.8", features = ["multipart"] }
leptos_router = "0.8"
axum = { version = "0.8", optional = true }
# Basic auth: encodes the expected credentials
base64 = { version = "0.23", optional = true }
# Gzip only: brotli's default level is slow for every page
tower-http = { version = "0.7", optional = true, features = [
    "catch-panic",
    "compression-gzip",
    "set-header",
] }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
], optional = true }
wasm-bindgen = "0.2"
# Awaits the browser's image APIs when shrinking a photo
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
# Default features pull in a CLI and syntax highlighting, neither of which we use
comrak = { version = "0.59", optional = true, default-features = false }
# Only the case and accent folding; the default also adds grapheme segmentation
nucleo-matcher = { version = "0.3", optional = true, default-features = false, features = [
    "unicode-casefold",
    "unicode-normalization",
] }
web-sys = { version = "0.3", features = [
    "Window",
    # Search box: `matches(":focus")`
    "Element",
    # Photo upload: shrinking and uploading, and removing old images from the text
    "Blob",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "ImageBitmap",
    "ImageEncodeOptions",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
]
ssr = [
    "dep:axum",
    "dep:base64",
    "dep:tower-http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:rusqlite",
    "dep:comrak",
    "dep:nucleo-matcher",
    "leptos/ssr",
    "leptos_router/ssr",
]

[profile.release]
lto = true
codegen-units = 1

# Size-optimized, for the WASM bundle
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
panic = "abort"

# Everything else is cargo-leptos's default
[package.metadata.leptos]
# The name of the JS/WASM/CSS files
output-name = "nom_front"
style-file = "style/main.scss"
site-addr = "127.0.0.1:3000"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
